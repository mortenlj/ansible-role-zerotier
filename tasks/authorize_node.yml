---
- block:
  - name: Authorize new members to network
    ansible.builtin.uri:
      url: "{{ zerotier_api_url }}/api/network/{{ zerotier_network_id }}/member/{{ ansible_facts['local']['zerotier']['node_id'] }}"
      method: POST
      headers:
        Authorization: bearer {{ zerotier_api_accesstoken }}
      body:
        hidden: false
        config:
          authorized: "{{ zerotier_authorize_member }}"
      body_format: json
    register: auth_apiresult
    delegate_to: "{{ zerotier_api_delegate }}"
    when:
    - ansible_facts['local']['zerotier']['networks'][zerotier_network_id] is not defined or
      ansible_facts['local']['zerotier']['networks'][zerotier_network_id]['status'] != 'OK'

  - name: Configure members in network
    ansible.builtin.uri:
      url: "{{ zerotier_api_url }}/api/network/{{ zerotier_network_id }}/member/{{ ansible_facts['local']['zerotier']['node_id'] }}"
      method: POST
      headers:
        Authorization: bearer {{ zerotier_api_accesstoken }}
      body:
        name: "{{ ansible_facts['hostname'] }}"
        config:
          ipAssignments: "{{ zerotier_member_ip_assignments | default() }}"
      body_format: json
    register: conf_apiresult
    delegate_to: "{{ zerotier_api_delegate }}"

  when:
  - not ansible_check_mode
  tags:
  - configuration
  become: false
